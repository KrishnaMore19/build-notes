services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleet
    volumes:
      # Runs once, in file order, on an empty volume: bootstrap -> schema -> seed -> api role.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports: ['5432:5432']
    healthcheck:
      # 127.0.0.1 on purpose: during first-time init Postgres only listens on a unix socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d fleet']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  api:
    build: .
    environment:
      DATABASE_URL: postgres://fleet_api:fleet_api@db:5432/fleet
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: '1'
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_S: ${CACHE_TTL_S:-5}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    deploy:
      replicas: ${API_REPLICAS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports: ['${NGINX_PORT:-8081}:80']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api]
